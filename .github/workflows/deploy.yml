name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  NEXT_PUBLIC_API_URL: http://65.0.138.40:5000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. Build and Push Frontend
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL=http://65.0.138.40:5000/auth -t ${{ env.DOCKER_USER }}/adviso-frontend:latest ./frontend
          docker push ${{ env.DOCKER_USER }}/adviso-frontend:latest

      # 2. Build and Push Backend
      - name: Build and Push Backend
        run: |
          docker build -t ${{ env.DOCKER_USER }}/adviso-backend:latest ./backend
          docker push ${{ env.DOCKER_USER }}/adviso-backend:latest

      # 3. SSH into EC2 and Deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/FYP_ADVISO
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
