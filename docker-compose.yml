version: '3.8'
services:
  backend:
    build: ./backend
    container_name: adviso_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env 
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: adviso_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://<your-EC2-public-IP>:5000 
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge