version: '3.8'
services:
  backend:
    image: nehaarshad/adviso-backend:latest
    build: ./backend
    container_name: adviso_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env 
    networks:
      - app-network

  frontend:
    image: nehaarshad/adviso-frontend:latest
    build: ./frontend
    container_name: adviso_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://65.0.138.40:5000
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge